name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner image already ships the Android SDK; just accept licenses
      # and make sure the needed platform/build-tools are present.
      - name: Prepare Android SDK
        run: |
          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TaskManager-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TaskManager.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TaskManager.apk \
            --title "Latest build" \
            --notes "Built from commit ${{ github.sha }}" \
            --target "${{ github.sha }}"
