name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner image already ships the Android SDK; just accept licenses
      # and make sure the needed platform/build-tools are present.
      - name: Prepare Android SDK
        run: |
          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            # Surface compile errors as one annotation so they are visible without the raw log.
            msg=$( { grep -E '^e: ' build.log; grep -A8 'What went wrong' build.log; } 2>/dev/null \
              | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/##' \
              | head -60 \
              | sed 's/%/%25/g' \
              | awk '{printf "%s%%0A", $0}' )
            echo "::error title=Gradle build failed::${msg}"
            exit "$code"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: TaskManager-apk
          retention-days: 1
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TaskManager.apk
          cp TaskManager.apk "TaskManager-5.0.${{ github.run_number }}.apk"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TaskManager.apk "TaskManager-5.0.${{ github.run_number }}.apk" \
            --title "Latest build 5.0.${{ github.run_number }}" \
            --notes "Build 5.0.${{ github.run_number }} from commit ${{ github.sha }}. If your phone downloads an older file, use the numbered APK: it has a new name every build." \
            --target "${{ github.sha }}"

      # Signed bundle for Google Play. Needs the UPLOAD_KEY_PASSWORD secret; skipped without it.
      # The upload key itself is stored encrypted in the repo (app/upload.keystore.enc).
      - name: Build signed release bundle
        continue-on-error: true
        env:
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$UPLOAD_KEY_PASSWORD" ]; then
            echo "::notice title=Release bundle skipped::Add the UPLOAD_KEY_PASSWORD repository secret to build the signed bundle."
            exit 0
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in app/upload.keystore.enc \
            -out "$RUNNER_TEMP/upload.jks" -pass env:UPLOAD_KEY_PASSWORD
          export UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          set +e
          ./gradlew bundleRelease --no-daemon --stacktrace > bundle.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            msg=$( { grep -E '^e: ' bundle.log; grep -A8 'What went wrong' bundle.log; } 2>/dev/null \
              | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/##' | head -60 \
              | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' )
            echo "::error title=Release bundle failed::${msg}"
            exit "$code"
          fi
          cp app/build/outputs/bundle/release/app-release.aab HabitAnvil.aab
          gh release upload latest HabitAnvil.aab --clobber
          rm -f "$RUNNER_TEMP/upload.jks"

      # Renders the main screens to PNG files and publishes them on the "previews" branch,
      # so spacing and clipped text can be checked without a phone. Never blocks a release.
      - name: Render screenshot previews
        continue-on-error: true
        run: |
          set +e
          ./gradlew testDebugUnitTest --no-daemon --tests '*PreviewShots*' > test.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            msg=$( { grep -E '^e: ' test.log; grep -m1 -A18 'ComposeTimeoutException' test.log; grep -E 'FAILED' test.log; } 2>/dev/null \
              | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/##' | head -40 \
              | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' )
            echo "::warning title=Preview tests failed::${msg}"
          fi
          exit "$code"

      - name: Publish previews branch
        if: always()
        continue-on-error: true
        run: |
          if ls app/build/previews/*.png > /dev/null 2>&1; then
            cd app/build/previews
            git init -q
            git checkout -q -b previews
            git config user.name "ci"
            git config user.email "ci@users.noreply.github.com"
            git add .
            git commit -q -m "previews for ${{ github.sha }}"
            git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" previews
          else
            echo "::warning title=No previews::no PNG files were produced"
          fi
